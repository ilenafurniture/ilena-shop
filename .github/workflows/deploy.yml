name: Deploy Ilena Shop to VPS

on:
  push:
    branches:
      - main # atau branch yang kamu pakai buat production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install SSH Key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Deploy to VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
          set -e
          cd /mine/ilenafurniture.com
          STASHED=0
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push --include-untracked -m "auto-deploy-$(date +%s)"
            STASHED=1
          fi
          git pull
          if [ "$STASHED" = "1" ]; then
            git stash pop || echo "WARN: stash pop conflict, perubahan lokal tersimpan di git stash list"
          fi
        EOF
