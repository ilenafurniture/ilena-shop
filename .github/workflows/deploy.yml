name: Deploy Ilena Shop to VPS

on:
  push:
    branches:
      - main # atau branch yang kamu pakai buat production

permissions:
  contents: read

concurrency:
  group: ilena-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    
    - name: Install SSH Key
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Deploy to VPS
      env:
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        VPS_IP: ${{ secrets.VPS_IP }}
        VPS_USER: ${{ secrets.VPS_USER }}
      run: |
        set -euo pipefail
        if [ -z "${VPS_KNOWN_HOSTS:-}" ]; then
          echo "ERROR: configure the VPS_KNOWN_HOSTS GitHub secret with the verified SSH host key."
          exit 1
        fi
        install -d -m 700 "$HOME/.ssh"
        printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"
        ssh-keygen -F "$VPS_IP" -f "$HOME/.ssh/known_hosts" >/dev/null || {
          echo "ERROR: VPS_KNOWN_HOSTS has no entry for VPS_IP."
          exit 1
        }
        ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_IP" 'bash -se' << 'EOF'
          set -euo pipefail
          cd /mine/ilenafurniture.com
          echo "[deploy] verify application working tree"
          if ! git diff --quiet -- . ':(exclude)public/img/barang/**' || ! git diff --cached --quiet -- . ':(exclude)public/img/barang/**'; then
            git status --short -- . ':(exclude)public/img/barang/**'
            echo "ERROR: tracked application files on VPS differ from Git."
            exit 1
          fi

          echo "[deploy] fetch origin/main"
          git fetch origin
          echo "[deploy] update tracked application files; preserve VPS product images"
          while IFS= read -r -d '' path; do
            case "$path" in
              public/img/barang/*)
                echo "ERROR: image path unexpectedly entered the application update list."
                exit 1
                ;;
            esac

            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git checkout origin/main -- "$path"
            else
              rm -f -- "$path"
              git rm --cached --ignore-unmatch -- "$path" >/dev/null
            fi
          done < <(git diff --name-only -z HEAD origin/main -- . ':(exclude)public/img/barang/**')
          git reset --soft origin/main

          echo "[deploy] install locked production dependencies with Composer CLI"
          PHP_BIN=/usr/local/lsws/lsphp83/bin/lsphp
          COMPOSER_BIN="$(command -v composer)"
          if [ ! -x "$PHP_BIN" ] || [ -z "$COMPOSER_BIN" ]; then
            echo "ERROR: LSPHP 8.3 or Composer is unavailable."
            exit 1
          fi
          # Composer requires the CLI SAPI; the server's default PHP CLI is 8.1.
          # Skip PHP platform validation for installation only; the web runtime
          # and migrations use LSPHP 8.3 and satisfy the project's ^8.2 requirement.
          COMPOSER_ALLOW_SUPERUSER=1 "$COMPOSER_BIN" install --no-dev --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-req=php

          echo "[deploy] run database migrations"
          spark_cli="$(mktemp /tmp/ilena-spark-cli.XXXXXX.php)"
          trap 'rm -f "$spark_cli"' EXIT
          cat > "$spark_cli" <<'PHP'
        <?php
        if (!defined('STDOUT')) define('STDOUT', fopen('php://stdout', 'wb'));
        if (!defined('STDERR')) define('STDERR', fopen('php://stderr', 'wb'));
        require '/mine/ilenafurniture.com/spark';
        PHP
          "$PHP_BIN" "$spark_cli" migrate

          echo "[deploy] restart Kak Wawa chat worker to load deployed code"
          systemctl restart ilena-chat-worker
          systemctl is-active --quiet ilena-chat-worker
          echo "[deploy] chat worker active"
          echo "[deploy] run local-origin smoke checks"
          for path in / /product /login; do
            curl --fail --silent --show-error --insecure --resolve ilenafurniture.com:443:127.0.0.1 \
              --max-time 20 -o /dev/null \
              -w "$path status=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s\n" \
              "https://ilenafurniture.com$path"
          done
          echo "[deploy] completed"
        EOF
