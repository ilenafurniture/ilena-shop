name: Deploy Ilena Shop to VPS

on:
  push:
    branches:
      - main # atau branch yang kamu pakai buat production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install SSH Key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Deploy to VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
          set -e
          cd /mine/ilenafurniture.com
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            STASH_MSG="auto-deploy-$(date +%Y%m%d-%H%M%S)"
            git stash push --include-untracked -m "$STASH_MSG"
            echo "INFO: perubahan lokal di-stash dengan label: $STASH_MSG"
            echo "INFO: cek dengan 'git stash list' & restore manual 'git stash pop' kalau perlu"
          fi
          git pull
        EOF
