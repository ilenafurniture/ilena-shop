name: Deploy Ilena Shop to VPS

on:
  push:
    branches:
      - main # atau branch yang kamu pakai buat production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install SSH Key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Deploy to VPS
      run: |
        ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} 'bash -se' << 'EOF'
          set -euo pipefail
          cd /mine/ilenafurniture.com
          echo "[deploy] verify tracked working tree"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git status --short
            echo "ERROR: tracked files on VPS differ from Git; resolve these changes before deployment."
            exit 1
          fi

          echo "[deploy] fetch origin/main"
          git fetch origin
          echo "[deploy] fast-forward to origin/main"
          git merge --ff-only origin/main
          echo "[deploy] run database migrations"
          php spark migrate
          echo "[deploy] completed"
        EOF
